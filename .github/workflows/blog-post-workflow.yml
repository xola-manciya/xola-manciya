name: Update README with Medium Posts

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Fetch the latest Medium posts
      - name: Fetch Latest Medium Posts
        run: |
          MEDIUM_USERNAME="your-medium-username" # Replace with your Medium username
          curl -s "https://medium.com/feed/@${MEDIUM_USERNAME}" | \
          grep -oP '(?<=<title><!\[CDATA\[)[^]]*' | \
          sed -n '2,6p' > medium_posts.txt

      # Step 3: Update README with the latest Medium posts
      - name: Update README
        run: |
          # Define placeholders
          START="<!-- START: Medium Posts -->"
          END="<!-- END: Medium Posts -->"

          # Fetch existing README content
          CONTENT=$(cat README.md)

          # Extract everything outside the Medium posts section
          BEFORE=$(echo "$CONTENT" | sed -n "/$START/,\$!p")
          AFTER=$(echo "$CONTENT" | sed -n "/$END/,\$p" | tail -n +2)

          # Generate the latest Medium posts
          echo "$START" > updated_readme.md
          while IFS= read -r post; do
            echo "- $post" >> updated_readme.md
          done < medium_posts.txt
          echo "$END" >> updated_readme.md

          # Combine everything into the updated README
          echo "$BEFORE" >> README.md
          cat updated_readme.md >> README.md
          echo "$AFTER" >> README.md

      # Step 4: Commit and push changes
      - name: Commit and Push Changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Update README with latest Medium posts"
          git push
